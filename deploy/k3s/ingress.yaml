# odysseus.delvrio.com → odysseus:7000. 모든 경로에 공통 로그인(SSO, middleware-sso.yaml)을 건다.
# 인증서: cert-manager letsencrypt-prod 가 odysseus-tls 를 발급한다. DNS odysseus.delvrio.com 을 bbb.delvrio.com 과 같은 곳으로 등록해야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odysseus-ingress
  namespace: odysseus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: odysseus-odysseus-sso@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - odysseus.delvrio.com
    secretName: odysseus-tls
  rules:
  - host: odysseus.delvrio.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: odysseus
            port:
              number: 7000
