# 예시 템플릿 — 실제 값은 클러스터에 직접 만든다(저장소에 커밋하지 않음). 절차는 README.md.
# 빈 값은 지워도 된다. ODYSSEUS_ADMIN_PASSWORD 를 비우면 첫 기동 로그에 임시 비밀번호가 찍힌다.
apiVersion: v1
kind: Secret
metadata:
  name: odysseus-secret
  namespace: odysseus
stringData:
  ODYSSEUS_ADMIN_PASSWORD: "<관리자 비밀번호>"
  # searxng 비밀키 — 비우면 searxng 가 재시작마다 새로 만든다
  SEARXNG_SECRET: "<긴 임의 문자열>"
  # 선택: 허깅페이스 모델 받기, 외부 검색 API, 구글 메일·캘린더 연동
  # HF_TOKEN: ""
  # TAVILY_API_KEY: ""
  # SERPER_API_KEY: ""
  # DATA_BRAVE_API_KEY: ""
  # GOOGLE_OAUTH_CLIENT_ID: ""
  # GOOGLE_OAUTH_CLIENT_SECRET: ""
  # GOOGLE_OAUTH_REDIRECT_URI: "https://odysseus.delvrio.com/..."
