# 영구 저장 공간 — nfs-hdd. 용량은 예상치의 2배 이상으로 잡는다(사용자 규칙).
# 휘발성 데이터(로그, searxng 설정, ntfy 캐시)는 PVC 를 쓰지 않고 각 Deployment 의 emptyDir(노드 로컬 디스크)에 둔다.
#
# odysseus-data 안의 폴더(docker-compose 의 ./data 와 같은 배치)
#   data/              → /app/data  (SQLite app.db, 설정, 인증, 업로드, 메일 첨부 …)
#   data/ssh/          → /app/.ssh  (Cookbook 원격 서버 SSH 키)
#   data/huggingface/  → /app/.cache/huggingface (로컬 모델 캐시 — 모델을 받으면 크게 늘어난다)
#   data/local/        → /app/.local (Cookbook 이 설치한 엔진·CLI)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-data
  namespace: odysseus
spec:
  storageClassName: nfs-hdd
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 120Gi
---
# chromadb 벡터 저장소(/data). 문서·메모리 임베딩이 쌓인다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-data
  namespace: odysseus
spec:
  storageClassName: nfs-hdd
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
