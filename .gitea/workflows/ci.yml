name: odysseus CI/CD

# Gitea main push → odysseus 이미지를 빌드해 k3s odysseus 네임스페이스에 배포한다(odysseus.delvrio.com).
# 구성은 hyungjin7/tnc-crm·slp·iii 와 같다(같은 러너·레지스트리·kubeconfig). upstream 의 .github/workflows 는 건드리지 않는다.
# GitHub main → Gitea main 동기화는 .github/workflows/sync-to-gitea.yml.
#
# 이미지 태그: 매니페스트는 :latest, CI 는 방금 빌드한 :<sha> 로 set image 한다(태그 되커밋 없음).
on:
  push:
    branches:
      - main
  # 수동 실행(Run workflow) 시에는 항상 빌드한다
  workflow_dispatch:

env:
  REGISTRY: "gitea.delvrio.com/hyungjin7/odysseus"
  NS: odysseus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        run: |
          set -e
          BEFORE="${{ gitea.event.before }}"
          AFTER="${{ gitea.event.after }}"
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "${BEFORE}^{commit}" >/dev/null; then
            BEFORE=$(git rev-parse -q --verify "${AFTER:-HEAD}~1" || git hash-object -t tree /dev/null)
          fi
          DIFF=$(git diff --name-only "$BEFORE" "${AFTER:-HEAD}" || true)
          echo "변경 파일:"; echo "$DIFF"
          # 배포 설정·문서·GitHub 워크플로만 바뀌었으면 이미지는 다시 만들지 않는다
          CODE=$(echo "$DIFF" | grep -vE '^(deploy/k3s/|\.gitea/|\.github/|docs/|website/|plans/|specs/)|\.md$' || true)
          # 레지스트리에 이미지가 아직 없으면(첫 배포 등) 코드 변경이 없어도 빌드한다
          HAS_IMAGE=true
          docker buildx imagetools inspect "${{ env.REGISTRY }}/app:latest" >/dev/null 2>&1 || HAS_IMAGE=false
          echo "레지스트리 app:latest 있음: $HAS_IMAGE"
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ] || [ -n "$CODE" ] || [ "$HAS_IMAGE" = "false" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "이미지 빌드: 예"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "이미지 빌드: 아니오(배포 설정만 적용)"
          fi

      - name: Install kubectl
        run: |
          curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - name: Apply base manifests
        run: |
          set -e
          K="kubectl --kubeconfig=/root/.kube/config"
          $K apply -f deploy/k3s/00-namespace.yaml
          # 이미지 pull 인증 — 없으면 bbb-namespace 것을 복사한다(같은 레지스트리 계정)
          if ! $K get secret gitea-registry-auth -n $NS >/dev/null 2>&1; then
            $K get secret gitea-registry-auth -n bbb-namespace -o json \
              | jq 'del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.managedFields,.metadata.annotations,.metadata.ownerReferences) | .metadata.namespace="'$NS'"' \
              | $K apply -f -
          fi
          if ! $K get secret odysseus-secret -n $NS >/dev/null 2>&1; then
            echo "::warning::odysseus-secret 이 없습니다 — 관리자 비밀번호가 첫 기동 로그에 찍힙니다(deploy/k3s/README.md)"
          fi
          # searxng 설정 템플릿·이전 스크립트는 저장소 파일 그대로 ConfigMap 으로 만든다
          $K create configmap searxng-files -n $NS \
            --from-file=settings.yml=config/searxng/settings.yml \
            --from-file=migrate_searxng_settings.py=scripts/migrate_searxng_settings.py \
            --dry-run=client -o yaml | $K apply -f -
          for f in pvc config networkpolicy middleware-sso ingress app-chromadb app-searxng app-ntfy; do
            $K apply -f deploy/k3s/$f.yaml
          done
          # 설정(ConfigMap)이 바뀌어도 본체가 새 값을 읽게 매니페스트도 매번 적용한다
          $K apply -f deploy/k3s/app-odysseus.yaml

      - name: Build and push image
        if: steps.detect.outputs.build == 'true'
        run: |
          set -e
          # 호스트 도커 인증 상속(bbb CI 와 같음) — provenance/sbom 끄고 단일 아키텍처 push
          docker buildx build --provenance=false --sbom=false -f Dockerfile \
            -t ${{ env.REGISTRY }}/app:${{ gitea.sha }} -t ${{ env.REGISTRY }}/app:latest --push .

      - name: Deploy
        run: |
          set -e
          K="kubectl --kubeconfig=/root/.kube/config"
          if [ "${{ steps.detect.outputs.build }}" = "true" ]; then
            $K set image deployment/odysseus odysseus=${{ env.REGISTRY }}/app:${{ gitea.sha }} -n $NS
          fi
          $K rollout status deployment/odysseus -n $NS --timeout=900s || echo "::warning::odysseus rollout 대기 시간 초과"
